# Fork test catalogue: a machine-readable copy of test-plan.md § 3
# (revision 2). Expected lists for fork tests are generated from this file
# by `fathomdb/scripts/count-tests.py`, never from the build.
#
# Each [[test]] row:
#   name      the test function name (binding, test plan § 3)
#   module    its module path inside `binary`
#   binary    count-tests label: unittests:<crate> | test:<target>
#   kind      P pure, D device, F fault seam, X fresh process, C compile-time
#             (F+D: a fault seam on a device)
#   cells     G1..G8 and G5a/G5b (test plan § 4), plus the hosted CI jobs:
#             "hosted" (fathomdb_ test job), "pure" (fork pure-test job),
#             "t-unit" (T-UNIT job)
#   ignored   #[ignore]d in the code
#   landed    true once the test exists on fathomdb/0.19.10. Only landed rows
#             are expected; a test that exists while its row says false fails
#             `count-tests.py unlanded`. FC5/FC6 flip this in the commit that
#             adds the test.
#   cfg       compile condition: features (all required, closed over
#             Cargo.toml implications), arch, os, min_version, max_version
#             (CUDA feature number). Absent keys mean "any". For rows not yet
#             landed the cfg is provisional; the landing commit makes it exact.
#   red       the test plan's "RED at" entry
schema = 1
source = "fathomdb/test-plan.md § 3, revision 2 (31b1579)"

