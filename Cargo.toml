[package]
name = "cudarc-fathomdb"
version = "0.19.10"
edition = "2021"
authors = ["Chelsea Lowman <clowman1993@gmail.com>"]
license = "MIT OR Apache-2.0"

description = "FathomDB's fork of cudarc 0.19.10 (safe and minimal CUDA bindings); not the upstream crate. See FATHOMDB.md for the differences."
homepage = "https://github.com/coreyt/cudarc"
documentation = "https://docs.rs/cudarc-fathomdb"
repository = "https://github.com/coreyt/cudarc"
readme = "README.md"
# The fork's planning directory and its CI workflow are not part of the crate.
exclude = ["/fathomdb/", "/.github/workflows/fathomdb-ci.yaml"]

keywords = ["cuda", "nvidia", "gpu", "cudnn", "cublas"]
categories = [
    "api-bindings",
    "hardware-support",
    "memory-management",
    "no-std",
    "science",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Dependents keep writing `cudarc::...` under the fork's package name.
[lib]
name = "cudarc"

[package.metadata.docs.rs]
features = [
    "cuda-13040",
    "f16",
    "cudnn",
    "nccl",
    "cupti",
    "cusparse",
    "cusolver",
    "cusolvermg",
    "cufile",
    "nvtx",
    "cupti",
    "cutensor",
    "cufft",
]

[features]
default = [
    "std",
    "cublas",
    "cublaslt",
    "curand",
    "driver",
    "runtime",
    "nvrtc",
    "fallback-dynamic-loading",
]

fallback-latest = []
# FATHOMDB PATCH: no-op marker for the private memory pool primitive
# (FATHOMDB.md item 6). A dependent that enables it fails to resolve
# against an unpatched cudarc instead of failing on a missing symbol.
fathomdb-private-pool = []

cuda-version-from-build-system = []
cuda-11040 = []
cuda-11050 = []
cuda-11060 = []
cuda-11070 = []
cuda-11080 = []
cuda-12000 = []
cuda-12010 = []
cuda-12020 = []
cuda-12030 = []
cuda-12040 = []
cuda-12050 = []
cuda-12060 = []
cuda-12080 = []
cuda-12090 = []
cuda-13000 = []
cuda-13010 = []
cuda-13020 = []
cuda-13030 = []
cuda-13040 = []

fallback-dynamic-loading = []
dynamic-loading = []
dynamic-linking = []
static-linking = []

driver = []
nvrtc = []
cublas = ["driver"]
cublaslt = ["driver"]
runtime = ["driver"]
curand = ["driver"]
cusparse = ["driver"]
cusolver = ["driver", "cublas", "cublaslt", "cusparse"]
cusolvermg = ["cusolver"]
cufile = ["driver"]
nvtx = ["driver"]
cupti = ["runtime", "driver"]
cufft = ["driver"]

nccl-version-from-build-system = []
nccl-02018 = ["driver"]
nccl-02019 = ["driver"]
nccl-02020 = ["driver"]
nccl-02021 = ["driver"]
nccl-02022 = ["driver"]
nccl-02024 = ["driver"]
nccl-02025 = ["driver"]
nccl-02026 = ["driver"]
nccl-02027 = ["driver"]
nccl-02028 = ["driver"]
nccl-02029 = ["driver"]
nccl-02030 = ["driver"]
nccl = ["nccl-02030"]

cudnn-version-from-build-system = []
cudnn-08009 = ["driver"]
cudnn-09010 = ["driver"]
cudnn-09021 = ["driver"]
cudnn = ["cudnn-09021"]

cutensor-version-from-build-system = []
cutensor-02003 = ["driver"]
cutensor-02004 = ["driver"]
cutensor-02005 = ["driver"]
cutensor-02006 = ["driver"]
cutensor = ["cutensor-02006"]

std = []
no-std = ["no-std-compat/std"]
f16 = ["dep:half"]
f8 = ["dep:float8"]
f4 = ["dep:float4"]

[dependencies]
no-std-compat = { version = "0.4.1", optional = true, features = ["alloc"] }
half = { version = "2", optional = true, default-features = false, features = [
    "num-traits",
    "rand_distr",
] }
float8 = { version = "0.7.0", optional = true }
float4 = { version = "0.2.0", optional = true }
libloading = "0.9.0"
